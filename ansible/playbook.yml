# Play 1: prepara as duas VMs (sistema, pacotes e Docker)
- name: Preparar as VMs
  hosts: all
  become: true
  gather_facts: false
  pre_tasks:
    - name: Esperar a VM aceitar conexões SSH
      wait_for_connection:
        timeout: 300
  roles:
    - os_updates
    - docker

# Play 2: disco de dados e MongoDB, somente na VM banco
- name: Configurar o banco de dados
  hosts: banco
  become: true
  gather_facts: false
  roles:
    - data_disk
    - mongodb

# Play 3: API e frontend, somente na VM app (depois do banco)
- name: Configurar a aplicação
  hosts: app
  become: true
  gather_facts: false
  roles:
    - app