# Prepara as duas VMs: espera ficarem acessíveis, atualiza o
# sistema, instala os pacotes e o Docker.
- name: Preparar as VMs
  hosts: all
  # Executa as tarefas como administrador (sudo)
  become: true
  # Não coleta informações antes de esperar a VM ligar
  gather_facts: false

  # pre_tasks rodam antes das roles
  pre_tasks:
    - name: Esperar a VM aceitar conexões SSH
      wait_for_connection:
        timeout: 300

  roles:
    - os_updates
    - docker