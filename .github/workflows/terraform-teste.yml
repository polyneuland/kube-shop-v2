
# Pipeline do Terraform: planeja, cria/atualiza ou destrói a
# infraestrutura na AWS, conforme o ambiente e a operação escolhidos
name: Terraform

# Trigger: execução manual pela aba Actions ("Run workflow"),
# com o ambiente e a operação escolhidos em listas
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente de destino
        type: choice
        options:
          - dev
          - homolog
          - prod
        default: dev

      # Operação: plan (só mostra), apply (cria ou atualiza)
      # ou destroy (apaga tudo que o Terraform criou)
      action:
        description: O que a pipeline deve fazer com a infraestrutura
        type: choice
        options:
          - plan
          - apply 
          - destroy
        default: plan

jobs:
  terraform:
    # Maquina temporaria (runner) emprestada pelo GitHub
    # Ela eh apagada ao final, por isso o state fica no S3
    runs-on: ubuntu-latest

    # Variaveis disponiveis para todos os passos do job
    env:
      # Credenciais da AWS, lidas dos GitHub Secrets
      # O provider da AWS reconhece esses nomes automaticamente
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      # O prefixo TF_VAR_ faz o Terraform receber este valor como
      # var.environment. Vem do parametro escolhido na tela
      TF_VAR_environment: ${{ inputs.environment }}

      # Chave SSH pública, vinda da Variable do GitHub
      TF_VAR_ssh_public_key: ${{ vars.SSH_PUBLIC_KEY }}

    # Todos os comandos "run" rodam dentro da pasta terraform,
    # onde estao os arquivos .tf
    defaults:
      run:
        working-directory: terraform

    # Passos executados em ordem. Se um falhar, a pipeline para
    steps:
      - name: Baixar o código do repositório para o runner
        uses: actions/checkout@v7

      - name: Instalar o Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          # Versao mais recente da serie 1.13 (atende ao >= 1.10)
          terraform_version: "~1.13.0"

          # Desliga o "embrulho" da action, que misturaria textos
          # extras ao capturar os outputs para o inventário do Ansible
          terraform_wrapper: false

      # So confere a formatacao, sem alterar nada.
      # Falha se algum arquivo nao estiver formatado
      - name: Conferir a formatação
        run: terraform fmt -check

      # Conecta ao bucket do state. O bucket e o caminho (key) sao
      # informados aqui porque o backend nao aceita variaveis.
      # Cada ambiente tem seu proprio arquivo de state
      - name: Inicializar e conectar ao bucket do state
        run: > 
          terraform init
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="key=kubeshop/${{ inputs.environment }}/terraform.tfstate"

      - name: Validar a sintaxe do código
        run: terraform validate

      # Plano normal (plan e apply): mostra o que será criado ou
      # alterado e salva no arquivo tfplan
      - name: Gerar e salvar o plano
        if: inputs.action != 'destroy'
        run: terraform plan -out=tfplan

      # Plano de destruição (destroy): mostra o que será apagado
      # e salva no arquivo tfplan
      - name: Gerar e salvar o plano de destruição
        if: inputs.action == 'destroy'
        run: terraform plan -destroy -out=tfplan

      # Executa exatamente o plano salvo. Não roda quando a operação
      # é plan. Aplicar um plano salvo não pede confirmação.
      - name: Aplicação do plano
        if: inputs.action != 'plan'
        run: terraform apply tfplan

      # Escreve a chave privada (do GitHub Secrets) num arquivo e
      # configura o SSH para usá-la ao entrar nas VMs
      - name: Preparar a chave SSH
        if: inputs.action == 'apply'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/pm04
          chmod 600 ~/.ssh/pm04
          cat > ~/.ssh/config <<'EOF'
          Host *
            User ubuntu
            IdentityFile ~/.ssh/pm04
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF

      # Monta o inventário do Ansible com os IPs dos outputs do
      # Terraform. Os IPs mudam a cada criação, por isso é gerado aqui
      - name: Gerar o inventário do Ansible
        if: inputs.action == 'apply'
        run: |
          APP_IP=$(terraform output -raw vm_app_public_ip)
          BANCO_IP=$(terraform output -raw vm_banco_private_ip)
          cat > ../ansible/inventory.ini <<EOF
          [app]
          vm_app ansible_host=${APP_IP} ansible_user=ubuntu

          [banco]
          vm_banco ansible_host=${BANCO_IP} ansible_user=ubuntu ansible_ssh_common_args='-o ProxyJump=ubuntu@${APP_IP}'
          EOF
          cat ../ansible/inventory.ini

      # Instala o Ansible na máquina da pipeline
      - name: Instalar o Ansible
        if: inputs.action == 'apply'
        run: |
          pipx install --include-deps ansible
          ansible --version

      # Roda o playbook nas VMs, usando o inventário gerado acima
      - name: Executar o Ansible
        if: inputs.action == 'apply'
        working-directory: ansible
        env:
          ANSIBLE_FORCE_COLOR: "true"
        run: ansible-playbook -i inventory.ini playbook.yml